# ---------------------------------------------------------------------------
# Intégration continue
# ---------------------------------------------------------------------------
# Ce flux vit dans `deepseekandroid` et **nulle part ailleurs**. Le dépôt `coran-memoire`
# n'est pas touché : il est la source de référence, en lecture seule, et rien ici ne le
# construit ni ne le modifie.
#
# Ce qui est vérifié, et pourquoi dans cet ordre :
#
#   1. **les tests unitaires d'abord.** Ils tournent sur la JVM en quelques dizaines de
#      secondes et couvrent les règles qui coûtent cher quand elles sont fausses : fusion de
#      compte, dates de séance, révisions, porte d'entrée. Un échec ici doit être connu avant
#      qu'on ait dépensé cinq minutes de compilation Android ;
#   2. **les compteurs des documents ensuite**, et c'est **parce que rien ne les lisait qu'ils
#      ont dérivé** : mesuré, `README.md` annonçait 983 tests du domaine quand le banc en
#      comptait 1056, `ARCHITECTURE.md` en annonçait 787, le partage des tests de `navigation`
#      avait sept tests de retard, et le nombre de cas du falsificateur était resté à 272. Cette
#      étape relit les rapports écrits par l'étape précédente — elle doit donc venir **après**
#      les tests — et refuse si un compteur annoncé n'est pas celui du banc ;
#   3. **les licences des ressources embarquées.** Le paquet redistribue 48,85 Mo de polices
#      QCF v4 qui ne sont pas les nôtres, et leurs conditions — « aucune publicité distrayante »,
#      « respecter les conditions amont » — s'imposent à qui les distribue. L'étape vérifie que
#      le `NOTICE.md` nomme chaque famille embarquée, que `provenance.json` couvre encore les 604
#      polices livrées, et qu'aucune régie publicitaire n'est déclarée. Elle ne dépend pas des
#      tests, mais elle suit les deux autres contrôles d'outil pour que ceux-ci restent groupés ;
#   4. **le lint ensuite.** Il attrape ce que les tests ne voient pas — permission manquante,
#      API trop récente pour le `minSdk`, ressource inutilisée ;
#   5. **l'APK de test enfin.** C'est la preuve que l'application est réellement assemblable,
#      et l'artefact est joint pour être installé sans reconstruire.
#
# Aucun secret n'est **nécessaire** : sans `SUPABASE_ANON_KEY`, l'application se compile en mode
# hors ligne et le dit (`SupabaseConfig.isConfigured`). Le flux reste donc vert sur un dépôt nu.
#
# Mais si le dépôt porte un secret `SUPABASE_ANON_KEY`, il est injecté dans les étapes Gradle et
# l'APK publié se connecte réellement au projet. C'est le bon endroit : un secret de dépôt n'est
# ni dans l'historique Git, ni dans les journaux (GitHub le masque), ni dans le code.
#
# **Ce qui ne doit jamais arriver ici : la clé `service_role`.** Elle contourne les politiques RLS
# et donnerait à quiconque l'extrait de l'APK un accès total aux données de tous les comptes.
# Seule la clé publiable est lue.
#
# Les actions sont en **Node 24** : `checkout@v5`, `setup-java@v5`, `upload-artifact@v6` et
# `setup-android@v4` sont les **premières** versions de chaque action à tourner sur ce
# runtime. Rester en `v4`/`v3` les faisait tourner de force sur Node 24, en annonçant une
# dépréciation à chaque exécution.
# ---------------------------------------------------------------------------

name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Une seule exécution par référence : pousser deux fois de suite ne doit pas faire tourner
  # deux constructions en parallèle pour rien.
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Tests, lint et APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Injectées si le dépôt porte les secrets, vides sinon. Une variable vide est traitée comme
    # absente par `connectionSetting` : l'application se compile alors hors ligne au lieu d'échouer.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer le JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Le projet cible Java 17, mais AGP 8.13 est plus confortable sous 21. C'est la
          # version utilisée en local, donc la CI mesure la même chose que le poste.
          java-version: "21"
          cache: gradle

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          # `packages` reste nécessaire, mais la raison a **changé avec `v4`**.
          #
          # En `v3`, le défaut était `tools platform-tools`, et le paquet `tools` n'existe plus
          # dans le dépôt SDK — remplacé par `cmdline-tools`. L'action échouait donc sur
          # « Warning: Failed to find package 'tools' » puis « exit code 1 », **avant** que
          # Gradle ne soit appelé : le journal ne parlait ni de tests, ni de lint, ni de code.
          #
          # En `v4`, le défaut est `platform-tools` **seul** : l'échec ci-dessus ne peut plus se
          # produire. On demande donc ce que le projet **cible** — compileSdk 36, build-tools
          # 36 — au lieu de compter sur un défaut qui ne les installe pas.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Rendre le lanceur exécutable
        # Le bit exécutable n'est pas toujours conservé par le dépôt ; sans cela, `./gradlew`
        # échoue sur un « Permission denied » qui ne dit rien de la vraie cause.
        run: chmod +x gradlew

      - name: Tests unitaires
        run: ./gradlew test --console=plain --stacktrace

      - name: Vérifier les compteurs des documents
        # Les outils de `tools/` ne tournent pas tout seuls, et un compteur recopié **dérive** :
        # il est cru. Cette étape lit les rapports XML écrits par l'étape précédente — d'où sa
        # place, juste après les tests —, compare **chaque ligne** des deux tableaux au rapport du
        # coureur, exige que la **somme** des lignes retombe sur le total annoncé, et contrôle le
        # nombre de cas du falsificateur par son propre `--verifier`. Elle ne lance pas Gradle :
        # elle ajoute quelques secondes, pas une compilation.
        run: python3 tools/verifier-compteurs-documents.py

      - name: Vérifier les licences des ressources embarquées
        # Le paquet redistribue 48,85 Mo de polices QCF v4 qui viennent d'une archive tierce.
        # Leurs conditions s'imposent à qui les distribue, et la condition « aucune publicité »
        # se lit dans les dépendances déclarées — le seul chemin par lequel une régie peut
        # entrer. L'étape vérifie que `NOTICE.md` nomme chaque famille embarquée, que
        # `provenance.json` couvre encore les 604 polices livrées, que les polices de page
        # portent toujours leurs tables couleur, et qu'aucune dépendance publicitaire n'est
        # déclarée. Sans réseau, sans secret, quelques secondes.
        run: python3 tools/verifier-licences.py

      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Assembler l'APK de test
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Publier l'APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publier les rapports de tests
        # Toujours, et pas seulement en cas d'échec : c'est le rapport du coureur qui dit
        # combien de tests ont réellement tourné, et un total vert sans rapport ne prouve rien.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rapports-tests
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: warn
